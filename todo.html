<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>待办清单</title>
<style>
  :root {
    --primary: #7c3aed;
    --primary-light: #ede9fe;
    --danger: #ef4444;
    --text: #1e293b;
    --text-light: #94a3b8;
    --bg: #f1f5f9;
    --card: #ffffff;
    --border: #e2e8f0;
    --shadow: 0 4px 24px rgba(0,0,0,0.08);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #e0e7ff 0%, #fae8ff 50%, #e0e7ff 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 60px 20px;
  }

  .card {
    background: var(--card);
    border-radius: 20px;
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 480px;
    overflow: hidden;
  }

  .header {
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    color: #fff;
    padding: 28px 28px 24px;
  }
  .header h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .header p {
    font-size: 14px;
    opacity: 0.8;
    margin-top: 4px;
  }

  .input-area {
    display: flex;
    gap: 10px;
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
  }
  .input-area input {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }
  .input-area input:focus {
    border-color: var(--primary);
  }
  .input-area button {
    padding: 12px 20px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    white-space: nowrap;
  }
  .input-area button:hover { background: #6d28d9; }
  .input-area button:active { transform: scale(0.96); }

  .list {
    list-style: none;
    min-height: 120px;
    max-height: 420px;
    overflow-y: auto;
  }
  .list:empty::after {
    content: "暂无任务，添加一个吧 ✨";
    display: block;
    text-align: center;
    padding: 48px 24px;
    color: var(--text-light);
    font-size: 14px;
  }

  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 24px;
    border-bottom: 1px solid #f1f5f9;
    transition: background 0.15s;
  }
  .item:hover { background: #f8fafc; }

  .item .text {
    flex: 1;
    font-size: 15px;
    color: var(--text);
    cursor: pointer;
    position: relative;
    transition: color 0.25s;
    word-break: break-word;
  }
  .item .text::after {
    content: "";
    position: absolute;
    left: 0;
    top: 50%;
    width: 0;
    height: 2px;
    background: var(--text-light);
    transition: width 0.25s ease;
  }
  .item.done .text {
    color: var(--text-light);
  }
  .item.done .text::after {
    width: 100%;
  }

  .delete-btn {
    width: 30px;
    height: 30px;
    border: none;
    background: transparent;
    color: var(--text-light);
    font-size: 20px;
    cursor: pointer;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s, background 0.15s;
    flex-shrink: 0;
  }
  .delete-btn:hover {
    color: var(--danger);
    background: #fef2f2;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 24px;
    font-size: 13px;
    color: var(--text-light);
    background: #fafafa;
    border-top: 1px solid var(--border);
  }
  .footer button {
    background: none;
    border: none;
    color: var(--primary);
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
  }
  .footer button:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>待办清单</h1>
    <p>让每一天都有条不紊</p>
  </div>

  <div class="input-area">
    <input type="text" id="input" placeholder="写一个新任务..." maxlength="200">
    <button id="addBtn">添加</button>
  </div>

  <ul class="list" id="list"></ul>

  <div class="footer">
    <span id="counter"></span>
    <button id="clearDone">清除已完成</button>
  </div>
</div>

<script>
  const STORAGE_KEY = "todo_data";

  let tasks = [];

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      tasks = raw ? JSON.parse(raw) : [];
    } catch { tasks = []; }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  function render() {
    const list = document.getElementById("list");
    list.innerHTML = "";

    tasks.forEach((t, i) => {
      const li = document.createElement("li");
      li.className = "item" + (t.done ? " done" : "");

      const text = document.createElement("span");
      text.className = "text";
      text.textContent = t.text;
      text.addEventListener("click", () => toggle(i));

      const del = document.createElement("button");
      del.className = "delete-btn";
      del.textContent = "×";
      del.addEventListener("click", (e) => { e.stopPropagation(); remove(i); });

      li.appendChild(text);
      li.appendChild(del);
      list.appendChild(li);
    });

    updateCounter();
  }

  function add() {
    const input = document.getElementById("input");
    const text = input.value.trim();
    if (!text) return;
    tasks.unshift({ text, done: false });
    input.value = "";
    input.focus();
    save();
    render();
  }

  function toggle(i) {
    tasks[i].done = !tasks[i].done;
    save();
    render();
  }

  function remove(i) {
    tasks.splice(i, 1);
    save();
    render();
  }

  function clearDone() {
    tasks = tasks.filter(t => !t.done);
    save();
    render();
  }

  function updateCounter() {
    const done = tasks.filter(t => t.done).length;
    document.getElementById("counter").textContent =
      tasks.length === 0 ? "暂无任务" : `已完成 ${done} / ${tasks.length}`;
  }

  document.getElementById("addBtn").addEventListener("click", add);
  document.getElementById("input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") add();
  });
  document.getElementById("clearDone").addEventListener("click", clearDone);

  load();
  render();
</script>

</body>
</html>
