<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后台管理登录 — 湘潭市中环水务</title>
<style>
  :root {
    --primary: #1a56db;
    --primary-dark: #0f3dab;
    --text: #1e293b;
    --text-light: #64748b;
    --white: #fff;
    --bg: #f1f5f9;
    --border: #e2e8f0;
    --radius: 8px;
    --shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: linear-gradient(135deg, #0f2b6e 0%, #1a56db 50%, #0891b2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    padding: 20px;
  }
  .login-card {
    background: var(--white);
    border-radius: 12px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.2);
    padding: 40px 36px;
    width: 100%;
    max-width: 400px;
  }
  .login-brand {
    text-align: center;
    margin-bottom: 32px;
  }
  .login-logo {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, var(--primary), #0891b2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    margin: 0 auto 14px;
    box-shadow: 0 4px 16px rgba(26,86,219,0.3);
  }
  .login-brand h1 {
    font-size: 20px;
    color: var(--text);
    letter-spacing: 0.5px;
  }
  .login-brand p {
    font-size: 13px;
    color: var(--text-light);
    margin-top: 4px;
  }
  .form-group {
    margin-bottom: 18px;
  }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text);
  }
  .form-group input {
    width: 100%;
    padding: 10px 14px;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.2s;
    outline: none;
  }
  .form-group input:focus {
    border-color: var(--primary);
  }
  .btn-login {
    width: 100%;
    padding: 12px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 1px;
    font-family: inherit;
    transition: background 0.2s;
  }
  .btn-login:hover { background: var(--primary-dark); }
  .btn-login:disabled {
    opacity: 0.7;
    cursor: not-allowed;
  }
  .login-error {
    background: #fef2f2;
    color: #dc2626;
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
  .login-error.show { display: block; }
  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="login-card">
  <div class="login-brand">
    <div class="login-logo">💧</div>
    <h1>湘潭市中环水务</h1>
    <p>内容管理系统 · 管理员登录</p>
  </div>

  <div class="login-error" id="loginError"></div>

  <form id="loginForm" autocomplete="off">
    <div class="form-group">
      <label for="email">管理员邮箱</label>
      <input type="email" id="email" placeholder="admin@xtzhsw.com" required autofocus>
    </div>
    <div class="form-group">
      <label for="password">登录密码</label>
      <input type="password" id="password" placeholder="请输入密码" required>
    </div>
    <button type="submit" class="btn-login" id="btnLogin">登 录</button>
  </form>
</div>

<script src="admin-client.js"></script>
<script>
(function () {
  var loginForm = document.getElementById('loginForm');
  var btnLogin = document.getElementById('btnLogin');
  var errorEl = document.getElementById('loginError');
  var emailInput = document.getElementById('email');
  var passwordInput = document.getElementById('password');

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.add('show');
  }

  function hideError() {
    errorEl.classList.remove('show');
  }

  function setLoading(loading) {
    btnLogin.disabled = loading;
    btnLogin.innerHTML = loading
      ? '<span class="spinner"></span>登录中…'
      : '登 录';
  }

  // If already authenticated, redirect to dashboard
  window.addEventListener('admin:ready', function () {
    window.location.href = 'index.html';
  });

  loginForm.addEventListener('submit', function (e) {
    e.preventDefault();
    hideError();

    var email = emailInput.value.trim();
    var password = passwordInput.value;

    if (!email || !password) {
      showError('请输入邮箱和密码');
      return;
    }

    setLoading(true);

    window._adminClient.login(email, password)
      .then(function (r) {
        // onAuthStateChange will dispatch 'admin:ready' which redirects
        if (r.error) {
          setLoading(false);
          if (r.error.message.indexOf('Invalid login') !== -1) {
            showError('邮箱或密码错误，请重试');
          } else if (r.error.message.indexOf('Email not confirmed') !== -1) {
            showError('邮箱未验证，请先在 Supabase 中确认邮箱');
          } else {
            showError('登录失败：' + r.error.message);
          }
        }
      })
      .catch(function (err) {
        setLoading(false);
        showError('登录失败：' + (err.message || '网络错误，请稍后重试'));
      });
  });
})();
</script>

</body>
</html>
