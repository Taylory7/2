<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片新闻管理 — 后台管理</title>
<style>
  .toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:12px; flex-wrap:wrap; }
  .btn { padding:9px 18px; border:none; border-radius:var(--radius); font-size:14px; cursor:pointer; font-family:inherit; transition:all 0.2s; font-weight:500; }
  .btn-primary { background:var(--primary); color:#fff; }
  .btn-primary:hover { background:var(--primary-dark); }
  .btn-outline { background:#fff; color:var(--primary); border:1px solid var(--primary); }
  .btn-outline:hover { background:var(--primary); color:#fff; }
  .btn-sm { padding:4px 10px; font-size:12px; }
  .btn-danger { background:#fff; color:#dc2626; border:1px solid #dc2626; }
  .btn-danger:hover { background:#dc2626; color:#fff; }
  .btn-edit { background:#dbeafe; color:#1e40af; border:1px solid #93c5fd; }
  .btn-edit:hover { background:#1e40af; color:#fff; }
  .data-table-wrap { background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--border); overflow:auto; }
  .data-table { width:100%; border-collapse:collapse; font-size:13px; min-width:750px; }
  .data-table th { background:#f8fafc; padding:10px 12px; text-align:left; font-weight:600; color:var(--text-light); font-size:12px; white-space:nowrap; border-bottom:2px solid var(--border); }
  .data-table td { padding:8px 12px; border-bottom:1px solid #f1f5f9; vertical-align:middle; }
  .data-table tr:hover td { background:#f8fafc; }
  .data-table .col-title { max-width:260px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .badge { font-size:11px; padding:2px 8px; border-radius:10px; white-space:nowrap; }
  .badge-recent { background:#dbeafe; color:#2563eb; }
  .badge-history { background:#f1f5f9; color:#64748b; }
  .badge-featured { background:#fef3c7; color:#d97706; }
  .pagination { display:flex; justify-content:center; align-items:center; gap:6px; padding:16px; flex-wrap:wrap; }
  .pagination button { padding:6px 12px; border:1px solid var(--border); border-radius:4px; background:#fff; cursor:pointer; font-family:inherit; font-size:13px; transition:all 0.15s; }
  .pagination button:hover { border-color:var(--primary); color:var(--primary); }
  .pagination button.active { background:var(--primary); color:#fff; border-color:var(--primary); }
  .pagination button:disabled { opacity:0.4; cursor:not-allowed; }
  .pagination .page-info { font-size:13px; color:var(--text-light); margin:0 8px; }

  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal-overlay.hidden { display:none; }
  .modal { background:#fff; border-radius:12px; box-shadow:0 16px 48px rgba(0,0,0,0.2); width:100%; max-width:600px; max-height:90vh; overflow-y:auto; }
  .modal-header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; background:#fff; z-index:1; }
  .modal-header h3 { font-size:16px; font-weight:600; }
  .modal-close { background:none; border:none; font-size:22px; cursor:pointer; color:var(--text-light); padding:4px 8px; line-height:1; }
  .modal-close:hover { color:var(--text); }
  .modal-body { padding:20px; }
  .form-group { margin-bottom:14px; }
  .form-group label { display:block; font-size:13px; font-weight:600; margin-bottom:4px; color:var(--text); }
  .form-group input,.form-group select,.form-group textarea { width:100%; padding:8px 12px; border:1.5px solid var(--border); border-radius:var(--radius); font-size:14px; font-family:inherit; outline:none; transition:border-color 0.2s; }
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus { border-color:var(--primary); }
  .form-group textarea { resize:vertical; min-height:60px; }
  .form-group .help-text { font-size:11px; color:var(--text-light); margin-top:2px; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .form-check { display:flex; align-items:center; gap:8px; }
  .form-check input[type=checkbox] { width:auto; }
  .form-actions { display:flex; justify-content:flex-end; gap:10px; padding-top:16px; border-top:1px solid var(--border); margin-top:4px; }
  .gradient-preview { height:30px; border-radius:4px; margin-top:4px; border:1px solid var(--border); }

  .confirm-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:300; display:flex; align-items:center; justify-content:center; padding:20px; }
  .confirm-overlay.hidden { display:none; }
  .confirm-box { background:#fff; border-radius:12px; padding:28px 24px; max-width:420px; width:100%; text-align:center; box-shadow:0 16px 48px rgba(0,0,0,0.2); }
  .confirm-box p { margin-bottom:20px; font-size:15px; line-height:1.6; }
  .confirm-box .confirm-title { font-weight:700; color:#dc2626; font-size:16px; margin-bottom:8px; }
  .confirm-actions { display:flex; gap:10px; justify-content:center; }
</style>
</head>
<body>

<div class="modal-overlay hidden" id="formModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">新建图片新闻</h3>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-body">
      <form id="itemForm" autocomplete="off">
        <input type="hidden" id="fid">
        <div class="form-row">
          <div class="form-group">
            <label>标题 *</label>
            <input type="text" id="ftitle" required placeholder="请输入图片新闻标题">
          </div>
          <div class="form-group">
            <label>图标 Emoji</label>
            <select id="ficon_emoji">
              <option value="🏗️">🏗️ 施工</option><option value="🔬">🔬 检测</option><option value="🌱">🌱 活动</option><option value="🏭">🏭 水厂</option><option value="🎤">🎤 会议</option><option value="💻">💻 技术</option><option value="🤝">🤝 合作</option><option value="🧪">🧪 实验</option><option value="🏆">🏆 荣誉</option><option value="🎪">🎪 开放日</option><option value="⚡">⚡ 电力</option><option value="🎆">🎆 联欢</option><option value="❄️">❄️ 寒潮</option><option value="🚒">🚒 演练</option><option value="🌊">🌊 水源</option><option value="📱">📱 上线</option><option value="🎓">🎓 培训</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>区域</label>
            <select id="fsection">
              <option value="recent">📷 近期图集</option><option value="history">📚 历史图集</option>
            </select>
          </div>
          <div class="form-group">
            <label>图集分类</label>
            <select id="falbum_category">
              <option value="construction">🏗️ 施工建设</option><option value="conference">🎤 会议活动</option><option value="honor">🏆 荣誉奖项</option><option value="testing">🔬 检测实验</option><option value="public_open">🎪 开放日</option><option value="emergency">🚒 应急演练</option><option value="culture">🎆 文化活动</option><option value="general">📷 综合</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>背景渐变 CSS</label>
          <select id="fbackground_gradient">
            <option value="linear-gradient(135deg,#dbeafe,#93c5fd)">蓝色渐变</option>
            <option value="linear-gradient(135deg,#d1fae5,#6ee7b7)">绿色渐变</option>
            <option value="linear-gradient(135deg,#fef3c7,#fcd34d)">黄色渐变</option>
            <option value="linear-gradient(135deg,#ede9fe,#c4b5fd)">紫色渐变</option>
            <option value="linear-gradient(135deg,#cffafe,#67e8f9)">青色渐变</option>
            <option value="linear-gradient(135deg,#ffe4e6,#fda4af)">粉色渐变</option>
            <option value="linear-gradient(135deg,#fce7f3,#f9a8d4)">玫红渐变</option>
            <option value="linear-gradient(135deg,#e0e7ff,#a5b4fc)">靛蓝渐变</option>
            <option value="linear-gradient(135deg,#ffedd5,#fb923c)">橙色渐变</option>
            <option value="linear-gradient(135deg,#1e40af,#2563eb)">深蓝渐变</option>
            <option value="linear-gradient(135deg,#047857,#0891b2)">蓝绿渐变</option>
            <option value="linear-gradient(135deg,#7c3aed,#a78bfa)">蓝紫渐变</option>
          </select>
          <div class="gradient-preview" id="gradientPreview"></div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>浏览量</label>
            <input type="number" id="fviews" value="0" min="0">
          </div>
          <div class="form-group">
            <label>排序序号</label>
            <input type="number" id="fsort_order" value="0" min="0">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>发布日期</label>
            <input type="date" id="fpublished_at">
          </div>
        </div>
        <div class="form-row" style="grid-template-columns:1fr 1fr;">
          <div class="form-check form-group">
            <input type="checkbox" id="fis_featured_main">
            <label for="fis_featured_main">焦点主图</label>
          </div>
          <div class="form-check form-group">
            <input type="checkbox" id="fis_featured_side">
            <label for="fis_featured_side">焦点侧图</label>
          </div>
        </div>
        <div class="form-group">
          <label>图片上传</label>
          <div style="display:flex;gap:8px;">
            <input type="file" id="fimage" accept="image/*" style="flex:1;">
            <button type="button" class="btn btn-outline btn-sm" id="btnUpload">📤 上传</button>
          </div>
          <input type="hidden" id="fimage_url">
          <div id="imagePreview" style="margin-top:8px;display:none;">
            <img src="" id="imgPreview" style="max-width:200px;max-height:150px;border-radius:4px;border:1px solid var(--border);">
            <button type="button" class="btn btn-sm btn-danger" id="btnRemoveImage" style="margin-left:8px;">✕ 移除</button>
          </div>
          <span class="help-text">支持 JPG/PNG/WebP，建议尺寸 800×600。上传后将替代背景渐变色显示真实图片</span>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-outline" id="modalCancel">取消</button>
          <button type="submit" class="btn btn-primary" id="modalSave">💾 保存</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="confirm-overlay hidden" id="confirmDialog">
  <div class="confirm-box">
    <div class="confirm-title">⚠️ 确认删除</div>
    <p id="confirmMsg">确定要删除这条图片新闻吗？此操作不可撤销。</p>
    <div class="confirm-actions">
      <button class="btn btn-outline" id="confirmCancel">取消</button>
      <button class="btn btn-danger" id="confirmOk">确定删除</button>
    </div>
  </div>
</div>

<script src="admin-client.js"></script>
<script>
(function () {
  var TOAST = window._adminClient.toast;
  var PAGE_SIZE = 15;
  var currentPage = 1;
  var deleteId = null;
  var albumNames = { construction:'施工建设', conference:'会议活动', honor:'荣誉奖项', testing:'检测实验', public_open:'开放日', emergency:'应急演练', culture:'文化活动', general:'综合' };

  window.addEventListener('admin:unauth', function () { window.location.href = 'login.html'; });
  window.addEventListener('admin:ready', function () {
    window._adminClient.renderShell('🖼️ 图片新闻管理');
    document.getElementById('adminContent').innerHTML =
      '<div class="toolbar">' +
        '<h3 style="font-size:15px">🖼️ 图片新闻列表</h3>' +
        '<button class="btn btn-primary" id="btnNew">＋ 新建图片新闻</button>' +
      '</div>' +
      '<div class="data-table-wrap" id="tableWrap">' +
        '<table class="data-table"><thead><tr>' +
          '<th>ID</th><th>标题</th><th>区域</th><th>分类</th><th>焦点</th><th>日期</th><th>浏览</th><th>操作</th>' +
        '</tr></thead><tbody id="tableBody"></tbody></table>' +
        '<div class="pagination" id="pagination"></div>' +
      '</div>';
    loadData();
    document.getElementById('btnNew').addEventListener('click', function () { openForm(null); });
    document.getElementById('modalClose').addEventListener('click', closeForm);
    document.getElementById('modalCancel').addEventListener('click', closeForm);
    document.getElementById('itemForm').addEventListener('submit', saveItem);
    document.getElementById('confirmCancel').addEventListener('click', function () { document.getElementById('confirmDialog').classList.add('hidden'); });
    document.getElementById('confirmOk').addEventListener('click', confirmDelete);
    // gradient preview
    document.getElementById('fbackground_gradient').addEventListener('change', function () {
      document.getElementById('gradientPreview').style.background = this.value;
    });
    document.getElementById('gradientPreview').style.background = document.getElementById('fbackground_gradient').value;
    document.getElementById('btnUpload').addEventListener('click', uploadImage);
    document.getElementById('btnRemoveImage').addEventListener('click', removeImage);
  });

  function showImagePreview(url) {
    document.getElementById('imgPreview').src = url;
    document.getElementById('imagePreview').style.display = 'block';
  }
  function hideImagePreview() {
    document.getElementById('imgPreview').src = '';
    document.getElementById('imagePreview').style.display = 'none';
    document.getElementById('fimage_url').value = '';
    document.getElementById('fimage').value = '';
  }
  async function uploadImage() {
    var file = document.getElementById('fimage').files[0];
    if (!file) { TOAST('请先选择图片文件', 'error'); return; }
    try {
      var url = await window._adminClient.uploadImage(file);
      document.getElementById('fimage_url').value = url;
      showImagePreview(url);
      TOAST('图片上传成功', 'success');
    } catch (e) { TOAST(e.message, 'error'); }
  }
  function removeImage() { hideImagePreview(); }

  async function loadData() {
    var db = window._adminClient.getClient();
    var start = (currentPage - 1) * PAGE_SIZE;
    var end = start + PAGE_SIZE - 1;
    var r = await db.from('photo_news').select('*', { count: 'exact' }).order('published_at', { ascending: false }).range(start, end);
    if (r.error) { TOAST('加载失败: ' + r.error.message, 'error'); return; }
    renderTable(r.data);
    renderPagination(r.count);
  }

  function renderTable(data) {
    var tbody = document.getElementById('tableBody');
    if (!data || !data.length) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-light);padding:32px;">暂无数据</td></tr>';
      return;
    }
    tbody.innerHTML = data.map(function (r) {
      var feats = [];
      if (r.is_featured_main) feats.push('⭐主图');
      if (r.is_featured_side) feats.push('📌侧图');
      return '<tr>' +
        '<td>' + r.id + '</td>' +
        '<td><div class="col-title">' + esc(r.icon_emoji) + ' ' + esc(r.title) + '</div></td>' +
        '<td><span class="badge ' + (r.section === 'recent' ? 'badge-recent' : 'badge-history') + '">' + (r.section === 'recent' ? '近期' : '历史') + '</span></td>' +
        '<td>' + (albumNames[r.album_category] || r.album_category) + '</td>' +
        '<td>' + (feats.length ? feats.join(' ') : '—') + '</td>' +
        '<td>' + (r.published_at || '—') + '</td>' +
        '<td>' + (r.views || 0) + '</td>' +
        '<td>' +
          '<button class="btn btn-sm btn-edit" data-edit="' + r.id + '">✏️ 编辑</button> ' +
          '<button class="btn btn-sm btn-danger" data-del="' + r.id + '">🗑 删除</button>' +
        '</td>' +
      '</tr>';
    }).join('');
    tbody.querySelectorAll('[data-edit]').forEach(function (btn) {
      btn.addEventListener('click', function () { openForm(parseInt(this.dataset.edit)); });
    });
    tbody.querySelectorAll('[data-del]').forEach(function (btn) {
      btn.addEventListener('click', function () { showDeleteConfirm(parseInt(this.dataset.del)); });
    });
  }

  function renderPagination(total) {
    var totalPages = Math.ceil(total / PAGE_SIZE) || 1;
    var el = document.getElementById('pagination');
    var html = '<button ' + (currentPage <= 1 ? 'disabled' : '') + ' id="btnPrev">上一页</button>';
    for (var i = 1; i <= totalPages; i++) {
      if (totalPages <= 7 || i === 1 || i === totalPages || Math.abs(i - currentPage) <= 1) {
        html += '<button class="' + (i === currentPage ? 'active' : '') + '" data-page="' + i + '">' + i + '</button>';
      } else if (i === 2 && currentPage > 3) html += '<button disabled>…</button>';
      else if (i === totalPages - 1 && currentPage < totalPages - 2) html += '<button disabled>…</button>';
    }
    html += '<button ' + (currentPage >= totalPages ? 'disabled' : '') + ' id="btnNext">下一页</button>';
    html += '<span class="page-info">共 ' + totalPages + ' 页 / ' + total + ' 条</span>';
    el.innerHTML = html;
    el.querySelectorAll('[data-page]').forEach(function (btn) {
      btn.addEventListener('click', function () { currentPage = parseInt(this.dataset.page); loadData(); });
    });
    var prevBtn = el.querySelector('#btnPrev'), nextBtn = el.querySelector('#btnNext');
    if (prevBtn) prevBtn.addEventListener('click', function () { if (currentPage > 1) { currentPage--; loadData(); } });
    if (nextBtn) nextBtn.addEventListener('click', function () { if (currentPage < totalPages) { currentPage++; loadData(); } });
  }

  function openForm(id) {
    var form = document.getElementById('itemForm');
    form.reset();
    document.getElementById('fid').value = '';
    document.getElementById('fviews').value = '0';
    document.getElementById('fsort_order').value = '0';
    document.getElementById('fpublished_at').value = new Date().toISOString().slice(0, 10);
    document.getElementById('gradientPreview').style.background = document.getElementById('fbackground_gradient').value;

    if (id) {
      document.getElementById('modalTitle').textContent = '编辑图片新闻';
      var db = window._adminClient.getClient();
      db.from('photo_news').select('*').eq('id', id).single().then(function (r) {
        if (r.data) {
          document.getElementById('fid').value = r.data.id;
          document.getElementById('ftitle').value = r.data.title || '';
          document.getElementById('ficon_emoji').value = r.data.icon_emoji || '📷';
          document.getElementById('fsection').value = r.data.section || 'recent';
          document.getElementById('falbum_category').value = r.data.album_category || 'construction';
          document.getElementById('fbackground_gradient').value = r.data.background_gradient || '';
          document.getElementById('fviews').value = r.data.views || 0;
          document.getElementById('fsort_order').value = r.data.sort_order || 0;
          document.getElementById('fpublished_at').value = r.data.published_at || '';
          document.getElementById('fis_featured_main').checked = r.data.is_featured_main || false;
          document.getElementById('fis_featured_side').checked = r.data.is_featured_side || false;
          document.getElementById('gradientPreview').style.background = r.data.background_gradient || '';
          if (r.data.image_url) { document.getElementById('fimage_url').value = r.data.image_url; showImagePreview(r.data.image_url); } else { hideImagePreview(); }
        }
      });
    } else {
      document.getElementById('modalTitle').textContent = '新建图片新闻';
      hideImagePreview();
    }
    document.getElementById('formModal').classList.remove('hidden');
  }

  function closeForm() { document.getElementById('formModal').classList.add('hidden'); }

  async function saveItem(e) {
    e.preventDefault();
    var db = window._adminClient.getClient();
    var data = {
      title: document.getElementById('ftitle').value.trim(),
      icon_emoji: document.getElementById('ficon_emoji').value,
      section: document.getElementById('fsection').value,
      album_category: document.getElementById('falbum_category').value,
      background_gradient: document.getElementById('fbackground_gradient').value,
      views: parseInt(document.getElementById('fviews').value) || 0,
      sort_order: parseInt(document.getElementById('fsort_order').value) || 0,
      published_at: document.getElementById('fpublished_at').value,
      is_featured_main: document.getElementById('fis_featured_main').checked,
      is_featured_side: document.getElementById('fis_featured_side').checked,
      image_url: document.getElementById('fimage_url').value,
    };
    if (!data.title) { TOAST('请输入标题', 'error'); return; }
    var id = document.getElementById('fid').value;
    var r = id ? await db.from('photo_news').update(data).eq('id', parseInt(id)) : await db.from('photo_news').insert([data]);
    if (r.error) { TOAST('保存失败: ' + r.error.message, 'error'); return; }
    TOAST(id ? '更新成功！' : '创建成功！', 'success');
    closeForm();
    loadData();
  }

  function showDeleteConfirm(id) {
    deleteId = id;
    document.getElementById('confirmMsg').textContent = '确定要删除 ID 为 ' + id + ' 的图片新闻吗？此操作不可撤销。';
    document.getElementById('confirmDialog').classList.remove('hidden');
  }

  async function confirmDelete() {
    if (!deleteId) return;
    var r = await window._adminClient.getClient().from('photo_news').delete().eq('id', deleteId);
    document.getElementById('confirmDialog').classList.add('hidden');
    if (r.error) { TOAST('删除失败: ' + r.error.message, 'error'); return; }
    TOAST('已删除', 'success');
    deleteId = null;
    loadData();
  }

  function esc(s) { var el = document.createElement('div'); el.textContent = s || ''; return el.innerHTML; }
})();
</script>

</body>
</html>
